[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "strength-atlas-cli"
version = "0.1.0"
description = "Strength Atlas CLI MVP"
readme = "docs/engineering/strength-atlas-cli-mvp-technical-plan.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
dependencies = [
  "typer>=0.12.3",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "rich>=13.7.1",
  "sqlalchemy>=2.0.29",
  "psycopg[binary]>=3.1.18",
  "alembic>=1.13.1",
]

[project.scripts]
atlas = "atlas.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]
