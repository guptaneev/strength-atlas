[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "strength-atlas-cli"
version = "0.1.0"
description = "Strength Atlas CLI MVP"
readme = "docs/engineering/strength-atlas-cli-mvp-technical-plan.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
dependencies = [
  "typer>=0.12.3",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "PyJWT>=2.9.0",
  "cryptography>=43.0.0",
  "rich>=13.7.1",
  "sqlalchemy>=2.0.29",
  "psycopg[binary]>=3.1.18",
  "alembic>=1.13.1",
  "browser-use-sdk>=0.3.0",
  "numpy>=2.1.0",
  "torch==2.7.1",
  "transformers>=4.51.0,<5.0.0",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1.1",
]

[project.scripts]
atlas = "atlas.cli.app:app"
atlas-api = "atlas.api.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]
