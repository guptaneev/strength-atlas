# Legacy Render alternative only. Cloud Run is the canonical deployment target.
# Auto-deploy stays disabled to prevent two production services from diverging.
services:
  - type: web
    name: strength-atlas-api
    runtime: docker
    plan: starter
    region: oregon
    numInstances: 1
    autoDeploy: false
    healthCheckPath: /health
    preDeployCommand: alembic -c alembic.ini upgrade head
    maxShutdownDelaySeconds: 30
    envVars:
      - key: ATLAS_APP_ENV
        value: production
      - key: ATLAS_API_DOCS_ENABLED
        value: "false"
      - key: ATLAS_ENFORCE_HTTPS_REDIRECT
        value: "true"
      - key: ATLAS_CORS_ALLOWED_ORIGINS
        sync: false
      - key: ATLAS_TRUSTED_HOSTS
        sync: false
      - key: ATLAS_DATABASE_URL
        sync: false
      - key: ATLAS_SUPABASE_URL
        sync: false
      - key: ATLAS_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: ATLAS_SUPABASE_SERVICE_KEY
        sync: false
      - key: ATLAS_SUPABASE_STORAGE_BUCKET
        sync: false
      - key: ATLAS_BROWSER_USE_API_KEY
        sync: false
      - key: ATLAS_RERANKER_MODEL_PATH
        value: /var/atlas/models/strength-atlas-cross-encoder-authoritative-v1
      - key: ATLAS_RERANKER_MODEL_VERSION
        value: strength-atlas-cross-encoder-authoritative-v1
      - key: ATLAS_RERANKER_WEIGHTS_SHA256
        value: cfaabc87dd4da2567d1d4ad8ac61398c9d45a0653d671362a24d52c57a200da7
