name: CI

on:
  push:
  pull_request:

jobs:
  docs-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject local absolute paths in docs
        run: |
          if rg -n "/Users/|C:\\\\" README.md docs; then
            echo "Found local absolute path(s) in docs."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -U pip
          pip install -e ".[dev]"
      - name: Run tests
        run: |
          . .venv/bin/activate
          pytest -q
      - name: Run static syntax checks
        run: |
          . .venv/bin/activate
          python -m compileall -q src scripts
          node --check src/atlas/web/static/app.js

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
