# Copy to var/atlas/cloud-run.env.yaml and replace every REPLACE_* value.
# Secrets are supplied from Google Secret Manager by scripts/deploy_cloud_run.sh.
ATLAS_APP_ENV: "production"
ATLAS_API_DOCS_ENABLED: "false"
ATLAS_ENFORCE_HTTPS_REDIRECT: "true"

# The deployment script replaces these bootstrap values with the generated
# Cloud Run URL before it grants public access.
ATLAS_CORS_ALLOWED_ORIGINS: "https://bootstrap.invalid"
ATLAS_TRUSTED_HOSTS: "bootstrap.invalid"

ATLAS_SUPABASE_URL: "https://REPLACE_PROJECT_REF.supabase.co"
ATLAS_SUPABASE_PUBLISHABLE_KEY: "REPLACE_PUBLISHABLE_KEY"
ATLAS_SUPABASE_STORAGE_BUCKET: "atlas-models"

ATLAS_REQUEST_MAX_BODY_BYTES: "131072"
ATLAS_ASK_REQUEST_TIMEOUT_SECONDS: "30"
ATLAS_ASK_LIFETIME_LIMIT: "5"
ATLAS_ASK_IP_RATE_LIMIT_WINDOW_SECONDS: "60"
ATLAS_ASK_IP_RATE_LIMIT_MAX_REQUESTS: "30"
ATLAS_ASK_USER_RATE_LIMIT_WINDOW_SECONDS: "60"
ATLAS_ASK_USER_RATE_LIMIT_MAX_REQUESTS: "20"
ATLAS_ASK_CONTACT_CTA_URL: "mailto:support@strengthatlas.app"

ATLAS_RERANKER_MODEL_PATH: "/var/atlas/models/strength-atlas-cross-encoder-authoritative-v1"
ATLAS_RERANKER_MODEL_VERSION: "strength-atlas-cross-encoder-authoritative-v1"
ATLAS_RERANKER_WEIGHTS_SHA256: "cfaabc87dd4da2567d1d4ad8ac61398c9d45a0653d671362a24d52c57a200da7"
ATLAS_RERANKER_CANDIDATE_DEPTH: "50"
ATLAS_RERANKER_MAX_LENGTH: "256"
ATLAS_RERANKER_BATCH_SIZE: "16"
ATLAS_RERANKER_TIMEOUT_SECONDS: "8"
ATLAS_RERANKER_MAX_WORKERS: "1"
ATLAS_RERANKER_FAILURE_COOLDOWN_SECONDS: "60"
ATLAS_RERANKER_MAX_ARCHIVE_BYTES: "536870912"

# Leave these absent for the first baseline deploy. Add them only after the
# immutable archive is present in private object storage.
# ATLAS_RERANKER_MODEL_URL: "https://REPLACE_PRIVATE_OBJECT_URL"
# ATLAS_RERANKER_ARCHIVE_SHA256: "18e9a27e5eb67e72b43c88ec81d25c25f5e3c9252e183c9d0232ca3e8ace2657"
